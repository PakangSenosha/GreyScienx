<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>GreyScienx research card</title>
  <style>
    :root { --black: #131200; --true-black: #000000; --coral: #f26157; --white: #fbfffe; --grey-100: #f0f1f2; --grey-300: #cccccc; --grey-500: #777777; --grey-700: #3d3d3d; }
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
    body { background: var(--white); color: var(--black); font-family: "Segoe UI", Arial, sans-serif; }
    #card { position: relative; width: 1080px; height: 1350px; padding: 66px 72px 54px; background: var(--white); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 30px; }
    #card::before { content: ""; position: absolute; inset: 0 0 auto; height: 10px; background: var(--coral); }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 36px; border-bottom: 3px solid var(--black); padding-bottom: 23px; }
    .brand-logo { display: block; width: 306px; height: auto; flex: 0 0 auto; }
    .edition { max-width: 560px; color: var(--grey-700); font-size: 19px; font-weight: 800; letter-spacing: 1.5px; line-height: 1.25; text-align: right; text-transform: uppercase; }
    .eyebrow { margin: 0 0 16px; color: var(--coral); font-size: 20px; font-weight: 950; letter-spacing: 2px; text-transform: uppercase; }
    h1 { max-width: 920px; margin: 0; color: var(--true-black); font-size: 66px; font-weight: 950; letter-spacing: -3.6px; line-height: 0.98; }
    .deck { max-width: 900px; margin: 18px 0 0; color: var(--grey-700); font-size: 25px; font-weight: 600; line-height: 1.35; }
    .evidence { min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--grey-300); padding-top: 26px; }
    .visual-label { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 16px; color: var(--grey-700); font-size: 17px; font-weight: 850; letter-spacing: 1.2px; text-transform: uppercase; }
    .visual-label span:last-child { color: var(--coral); text-align: right; }
    .figure { min-height: 0; flex: 1; display: flex; align-items: center; justify-content: center; background: var(--grey-100); border: 3px solid var(--black); padding: 28px 30px; overflow: hidden; }
    .figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .stat-wrap { width: 100%; text-align: left; }
    .stat { color: var(--coral); font-size: 180px; font-weight: 950; letter-spacing: -10px; line-height: 0.82; }
    .stat-label { max-width: 780px; margin-top: 34px; color: var(--black); font-size: 35px; font-weight: 850; letter-spacing: -1px; line-height: 1.2; }
    .bars { width: 100%; display: flex; flex-direction: column; gap: 30px; }
    .bar-row { display: grid; grid-template-columns: 215px minmax(0, 1fr) 145px; align-items: center; gap: 20px; }
    .bar-name { color: var(--black); font-size: 23px; font-weight: 800; line-height: 1.12; }
    .bar-track { height: 50px; background: #dedede; border-left: 3px solid var(--black); }
    .bar-fill { height: 100%; min-width: 4px; background: var(--black); }
    .bar-row.primary .bar-fill { background: var(--coral); }
    .bar-value { color: var(--black); font-size: 24px; font-weight: 950; text-align: right; }
    .caption { margin: 17px 0 0; color: var(--grey-700); font-size: 19px; font-weight: 600; line-height: 1.4; }
    .footer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 35px; align-items: end; border-top: 3px solid var(--black); padding-top: 22px; }
    .source { color: var(--grey-700); font-size: 16px; font-weight: 650; line-height: 1.35; }
    .url { color: var(--true-black); font-size: 21px; font-weight: 950; letter-spacing: -0.3px; text-align: right; }
    #card.dark { background: var(--true-black); color: var(--white); }
    #card.dark::before { height: 12px; }
    #card.dark h1, #card.dark .url { color: var(--white); }
    #card.dark .masthead, #card.dark .footer { border-color: var(--white); }
    #card.dark .edition, #card.dark .deck, #card.dark .source, #card.dark .caption { color: var(--grey-300); }
    #card.dark .evidence { border-color: var(--grey-700); }
    #card.dark .figure { background: #11110d; border-color: var(--white); }
    #card.dark .stat-label, #card.dark .bar-name, #card.dark .bar-value { color: var(--white); }
    #card.dark .bar-track { border-color: var(--white); background: #3a3a36; }
    #card.dark .bar-fill { background: var(--white); }
    #card.dark .bar-row.primary .bar-fill { background: var(--coral); }
  </style>
</head>
<body>
  <article id="card">
    <header class="masthead"><img class="brand-logo" id="brandLogo" src="__LOGO_LIGHT__" alt="GreyScienx"><div class="edition" id="edition"></div></header>
    <section><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p class="deck" id="deck"></p></section>
    <section class="evidence">
      <div class="visual-label"><span id="visualTitle"></span><span id="qualifier"></span></div>
      <div class="figure" id="figure">
        <img id="chartImage" alt="">
        <div class="stat-wrap" id="statWrap"><div class="stat" id="stat"></div><div class="stat-label" id="statLabel"></div></div>
        <div class="bars" id="bars"></div>
      </div>
      <p class="caption" id="caption"></p>
    </section>
    <footer class="footer"><div class="source" id="source"></div><div class="url" id="url"></div></footer>
  </article>
  <script>
    const DATA = __CARD_DATA__;
    const byId = (id) => document.getElementById(id);
    const text = (id, value) => { byId(id).textContent = value || ""; };
    const card = byId("card");
    if (DATA.theme === "dark") {
      card.classList.add("dark");
      byId("brandLogo").src = "__LOGO_DARK__";
    }
    ["edition", "eyebrow", "headline", "deck", "visualTitle", "qualifier", "caption", "source", "url"].forEach((key) => text(key, DATA[key]));
    const image = byId("chartImage");
    const statWrap = byId("statWrap");
    const bars = byId("bars");
    image.style.display = "none"; statWrap.style.display = "none"; bars.style.display = "none";
    if (DATA.chartImage) {
      image.src = DATA.chartImage; image.style.display = "block";
    } else if (DATA.stat) {
      text("stat", DATA.stat); text("statLabel", DATA.statLabel); statWrap.style.display = "block";
    } else if (Array.isArray(DATA.bars)) {
      const max = Math.max(...DATA.bars.map((item) => Number(item.value) || 0), 1);
      DATA.bars.forEach((item) => {
        const row = document.createElement("div"); row.className = `bar-row${item.primary ? " primary" : ""}`;
        const name = document.createElement("div"); name.className = "bar-name"; name.textContent = item.name;
        const track = document.createElement("div"); track.className = "bar-track";
        const fill = document.createElement("div"); fill.className = "bar-fill"; fill.style.width = `${Math.max(0, Number(item.value) || 0) / max * 100}%`;
        const value = document.createElement("div"); value.className = "bar-value"; value.textContent = item.label;
        track.appendChild(fill); row.append(name, track, value); bars.appendChild(row);
      });
      bars.style.display = "flex";
    }
  </script>
</body>
</html>
