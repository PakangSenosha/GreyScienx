research_definition:
  central_question: How does youth unemployment, followed across a lifetime, become old-age dependence?
  short_answer: 'In these scenarios, private wealth at 60 is R4.84 million for a stable formal career, R3.99 million after a five-year youth shock, R3.09 million if entry waits until 30, R0.91 million for a mostly informal career, and R0.15 million under persistent exclusion. The amounts are constant 2026 rand and are anchored to the same R30,000 monthly opportunity at age 25. Limitation: These are conditional scenarios, not forecasts. Informal work is modelled as lower-paid work with weaker pension coverage, not as work without value. Years worked are not enough: earnings, coverage, and the contribution rate decide how much work becomes retirement wealth.'
  abstract: Youth unemployment followed across a lifetime and into old-age dependence.
  motivation: Youth unemployment followed across a lifetime and into old-age dependence.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How can today's unemployment become tomorrow's pension pressure?
  - What happens to old-age income when early working years are spent unemployed?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
