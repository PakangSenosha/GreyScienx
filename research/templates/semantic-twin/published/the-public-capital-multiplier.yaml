research_definition:
  central_question: When do state-financed productive assets generate durable economic capacity?
  short_answer: 'In the central mixed portfolio, R225 billion of public industrial capital mobilises R506 billion of gross investment, 2.25 times the public envelope. After deductions, R383 billion remains operating, 1.70 times the envelope. Limitation: A multiplier is a description of a capital stack, not money created. Guarantees can show a high cash multiple while leaving the downside with the state. The multiples are not observed South African averages.'
  abstract: When state-financed productive assets generate durable economic capacity.
  motivation: When state-financed productive assets generate durable economic capacity.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What public-capital multiplier is at issue when grant-scale funds finance productive assets?
  - How can state investment become lasting capacity rather than a one-round expenditure?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: the alternative use of the same resource or rule
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
