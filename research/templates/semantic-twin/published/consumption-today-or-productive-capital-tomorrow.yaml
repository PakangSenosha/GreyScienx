  - The result is for the stated population, price basis and scenario.
  misuse_risks:
  - Do not present a modelled scenario as an observed outcome or forecast.
  - Do not report the catalogue description as a finding.
  falsification_conditions:
  - There is no universal year when a factory becomes better than a cash transfer. The best case requires exceptional execution and a credible residual asset. The original households are not necessarily repaid even if the aggregate account later wins.
  update_triggers:
  - Revise this form when the manuscript version changes.
