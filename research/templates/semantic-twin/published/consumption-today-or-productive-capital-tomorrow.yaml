research_definition:
  central_question: What is the timing and distributional trade-off between relief today and productive capital tomorrow?
  short_answer: 'At a 6 percent real discount rate, the best industrial case overtakes the central value of the cash transfer in 2040 when the surviving public asset is counted, and in 2051 when only operating benefits are counted. Limitation: There is no universal year when a factory becomes better than a cash transfer. The best case requires exceptional execution and a credible residual asset. The original households are not necessarily repaid even if the aggregate account later wins.'
  abstract: The timing and distributional trade-off between relief and investment.
  motivation: The timing and distributional trade-off between relief and investment.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - Who bears the wait if grant spending is redirected toward investment?
  - How does the R350 choice split between consumption and productive capital?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: the alternative use of the same resource or rule
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
