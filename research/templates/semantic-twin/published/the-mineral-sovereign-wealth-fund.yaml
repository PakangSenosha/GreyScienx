research_definition:
  central_question: What fiscal architecture converts exhaustible mineral resources into permanent public wealth?
  short_answer: 'Under the central rule, the fund reaches about R586 billion by 2060 and transfers about R16 billion that year, rising to R1.48 trillion and R43 billion by 2125, in constant 2026 rand. Limitation: A fund does not create a fiscal surplus. If the deposit is matched by new borrowing at a higher cost, the country has a leveraged portfolio rather than national savings. The transfer is a marginal public income, not a self-financing welfare state.'
  abstract: A fiscal architecture for converting exhaustible resources into permanent public wealth.
  motivation: A fiscal architecture for converting exhaustible resources into permanent public wealth.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How can a sovereign wealth fund hold mineral rents for the public?
  - What happens to public wealth when mineral revenue is saved rather than spent once?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
