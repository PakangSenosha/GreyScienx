limitations_and_risks:
  main_limitation: This is a modelled public balance, not a forecast and not a recommendation that every occupation retire at one age. Age 65 is fiscally robust in the manuscript's three labour-market cases. Age 70 and age 75 need the employment and disability conditions stated in the paper. The gain can come from fewer years of old-age support as well as from extra tax-paying years.
  limitations:
  - This is a modelled public balance, not a forecast and not a recommendation that every occupation retire at one age. Age 65 is fiscally robust in the manuscript's three labour-market cases. Age 70 and age 75 need the employment and disability conditions stated in the paper. The gain can come from fewer years of old-age support as well as from extra tax-paying years.
  - The youth figures are the result of assuming that each additional older-worker job displaces 0.15 of a youth job after demand, skill, and job-creation effects. They are not an observed count of lost jobs. A different displacement assumption changes the result.
  - The continuous-employment path is the strongest private case and the easiest to overstate. The manuscript's mixed-occupation path is lower because not everyone keeps a job after 60. A larger balance at a later age can coexist with years of weak earnings before the pension can be drawn.
  data_gaps:
  - External microdata behind the manuscript are not republished in this form.
  model_risks:
  - A different assumption can move or reverse the scenario.
  implementation_risks:
  - The scenario is not an implementation plan.
  external_validity_limits:
  - The result is for the stated population, price basis and scenario.
  misuse_risks:
  - Do not present a modelled scenario as an observed outcome or forecast.
  - Do not report the catalogue description as a finding.
  falsification_conditions:
  - This is a modelled public balance, not a forecast and not a recommendation that every occupation retire at one age. Age 65 is fiscally robust in the manuscript's three labour-market cases. Age 70 and age 75 need the employment and disability conditions stated in the paper. The gain can come from fewer years of old-age support as well as from extra tax-paying years.
  update_triggers:
  - Revise this form when the manuscript version changes.
