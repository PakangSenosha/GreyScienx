research_definition:
  central_question: Does raising the retirement age still work once youth unemployment, productivity, and disability are taken into account?
  short_answer: 'In the average scenario, raising the comparison retirement age from 60 to 65 produces a cumulative modelled public gain of R213 billion for a one-million-person cohort. Age 70 produces R369 billion and age 75 produces R448 billion. The last five-year step adds R79 billion, about half the gain from moving from 65 to 70. Limitation: This is a modelled public balance, not a forecast and not a recommendation that every occupation retire at one age. Age 65 is fiscally robust in the manuscript''s three labour-market cases. Age 70 and age 75 need the employment and disability conditions stated in the paper. The gain can come from fewer years of old-age support as well as from extra tax-paying years.'
  abstract: Later retirement tested against youth unemployment, productivity and disability.
  motivation: Later retirement tested against youth unemployment, productivity and disability.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What happens to a higher retirement age when younger workers are unemployed?
  - How do productivity and disability change the case for a later retirement age?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
