research_definition:
  central_question: Can domestic grid storage anchor a vanadium industry?
  short_answer: 'Under the paper''s central assumptions, vanadium redox flow batteries reach lifetime cost parity with lithium iron phosphate at about sixteen hours of duration. Limitation: Sixteen hours is a model result, not a physical law. Cheap lithium, low cycling, high interest rates or poor flow-battery performance move the crossing later. The first market in the manuscript is roughly twelve to twenty-four hours, not the four-hour lithium market.'
  abstract: Domestic grid storage as an anchor market for vanadium industrialisation.
  motivation: Domestic grid storage as an anchor market for vanadium industrialisation.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does grid storage create a home market for vanadium?
  - What industrial economy is built around vanadium and electricity storage?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
