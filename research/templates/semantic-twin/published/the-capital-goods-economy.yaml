research_definition:
  central_question: What equipment, capabilities, and supplier networks sit behind durable industrialisation?
  short_answer: 'In the central catch-up case, a weighted 6.7 percent equipment share produces about US$262 billion of South African equipment sales over twenty-five years and about US$201 billion of value retained in South Africa. Limitation: The paths are scenarios, not forecasts, and the retained value cannot be added mechanically to a GDP forecast. Some of this activity already exists. The result is a scale test of a selected machinery and service position, not a claim that South Africa should make every final product.'
  abstract: The equipment, capabilities and supplier networks behind durable industrialisation.
  motivation: The equipment, capabilities and supplier networks behind durable industrialisation.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - Why do capital goods determine whether industrialisation lasts?
  - What supplier base does a capital-goods economy require?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
