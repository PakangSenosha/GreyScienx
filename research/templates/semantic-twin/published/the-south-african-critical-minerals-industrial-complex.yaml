research_definition:
  central_question: How could South African mineral endowment be converted into industrial depth?
  short_answer: 'On the manuscript''s illustrative value pool, focused integration retains 66.3 percent, compared with 37.6 percent for the existing footprint and 81.4 percent for a frontier partnership case. Limitation: These are not forecasts of GDP or company revenue. Geology is not industrial power: the manuscript distinguishes reserve shares from mined-production shares.'
  abstract: An integrated strategy for converting mineral endowment into industrial depth.
  motivation: An integrated strategy for converting mineral endowment into industrial depth.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What industrial system connects critical minerals to domestic production?
  - How does the critical-minerals complex differ from exporting unprocessed ore?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
