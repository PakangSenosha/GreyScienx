research_definition:
  central_question: Which policy packages for closing an ageing-related fiscal deficit are examined for lower welfare loss?
  short_answer: 'Among five packages that each close a hypothetical R150 billion annual ageing gap, the balanced transition has the lowest modelled welfare-loss index, 64.5. The low-visible-pain package, which leans on inflation, diffuse cuts, and continuing borrowing, scores 107.3 and leaves about R720 billion of emergency debt after ten years. Limitation: The R150 billion gap is a stress test, not a forecast of today''s deficit. The welfare scores are internal model indexes, not percentages and not estimates of national wellbeing. The manuscript does not declare any package the single correct answer.'
  abstract: Policy packages for closing an ageing-related fiscal deficit with lower welfare loss.
  motivation: Policy packages for closing an ageing-related fiscal deficit with lower welfare loss.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How can an ageing-related fiscal deficit be closed?
  - What is the welfare comparison among emergency responses to demographic fiscal pressure?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
