research_definition:
  central_question: How can voter age structure redirect spending and intergenerational transfers?
  short_answer: 'In the 2025 calibration, people aged 60 or older are 15.1 percent of adults but 20.7 percent of votes cast. Applying the 2024 age-turnout pattern produces a median voter aged 43, four years older than the median adult. Limitation: The turnout rates are a strong pattern extrapolated from identification scans, not a perfect census of every voter. The median voter is the age that splits votes cast in half. It is not one person whose wishes become policy.'
  abstract: How voter age structure can redirect spending and intergenerational transfers.
  motivation: How voter age structure can redirect spending and intergenerational transfers.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does an ageing electorate change the politics of public spending?
  - What happens to intergenerational transfers when the median voter is older?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
