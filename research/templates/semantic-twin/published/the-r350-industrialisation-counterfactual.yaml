research_definition:
  central_question: What productive-capital alternative to repeated emergency cash transfers does the R350 counterfactual examine?
  short_answer: 'If the SRD envelope of about R253.5 billion in constant 2026 rand had been reprioritised into an industrial fund, the best case holds about R789 billion in productive assets by 2050 and generates roughly R39 billion a year in public cash. The annual cash flow exceeds one current SRD budget year only around 2049. Limitation: The envelope is a counterfactual resource, not yet a factory. The best case depends on projects being selected, built, operated and renewed for decades. This paper does not value what households would have lost if the grant had never been paid.'
  abstract: The productive-capital alternative to repeated emergency cash transfers.
  motivation: The productive-capital alternative to repeated emergency cash transfers.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What might South Africa have built with the SRD grant budget?
  - How does an industrialisation counterfactual compare with paying the R350 grant?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: the alternative use of the same resource or rule
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
