    text: If the SRD envelope of about R253.5 billion in constant 2026 rand had been reprioritised into an industrial fund, the best case holds about R789 billion in productive assets by 2050 and generates roughly R39 billion a year in public cash. The annual cash flow exceeds one current SRD budget year only around 2049.
