research_definition:
  central_question: What happens to housing, cities, and public infrastructure under population contraction?
  short_answer: 'In the central scenario, a 22.2 percent population decline by 2076 coincides with 3.5 percent more households. The same run can still produce a shortage of roughly 54,000 habitable homes after the city has lost 266,000 people. Limitation: This is a hypothetical region, not a forecast for a named Gauteng municipality. Housing demand follows households, so a falling headcount is not itself a falling housing demand. The shortage also depends on the stock deteriorating and on repairs being misallocated.'
  abstract: Housing, cities and public infrastructure under population contraction.
  motivation: Housing, cities and public infrastructure under population contraction.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What happens to house prices when population declines?
  - Can housing scarcity persist while population falls?
  - How should cities and infrastructure adjust when a country shrinks?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
