research_definition:
  central_question: What industrial deployment does a scenario at the scale of the grant programme describe?
  short_answer: 'A credible R225 billion programme could establish 34 industrial modules and, in the central case, support about 11,100 direct operating jobs, roughly 10,000 supplier jobs and R108 billion of annual sales. Limitation: The numbers are scenarios, not quotations or forecasts. Success depends more on utilisation and execution than on the number of ribbon cuttings. The programme takes close to a decade.'
  abstract: A concrete industrial deployment scenario at the scale of the grant programme.
  motivation: A concrete industrial deployment scenario at the scale of the grant programme.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What does a factory programme at R200 billion scale contain?
  - How is grant-scale public money represented as industrial plant?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: the alternative use of the same resource or rule
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
