research_definition:
  central_question: How can South African production serve the infrastructure of African city growth?
  short_answer: 'In the central build-out, South African-linked firms record US$264 billion of cumulative gross sales and about US$137 billion of domestic value added over twenty-five years. Limitation: The envelope is a constructed scenario, not an official infrastructure estimate, and it includes private buildings. The employment numbers are scale indicators, not forecasts. A 1.4 percent of GDP level effect is not a permanent 1.4 percentage-point addition to annual growth.'
  abstract: South African production positioned around the infrastructure of African city growth.
  motivation: South African production positioned around the infrastructure of African city growth.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What industrial role does South Africa have in African urbanisation?
  - Which city-building goods could a South African factory system supply?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
