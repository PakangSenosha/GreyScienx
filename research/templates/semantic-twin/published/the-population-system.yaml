research_definition:
  central_question: How do the population studies connect as one policy system?
  short_answer: 'Demographic pressure, in this synthesis, is rarely a shortage of people in the abstract. It is a failure of timing, matching and institutions. Income can arrive after it is useful, workers can exist outside the jobs that need them, homes can stand in the wrong places, and reform can begin after the cheaper options have expired. Limitation: This is a structural reading of ten hypothetical models, not a new forecast and not a single national estimate. The magnitudes belong to the individual studies. A smaller population can still need more homes, and higher productivity can preserve GDP while hospitals remain understaffed.'
  abstract: A synthesis of the ten population studies as one connected policy system.
  motivation: A synthesis of the ten population studies as one connected policy system.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How do retirement, fertility, housing, labour, and fiscal pressure interact?
  - What does population decline look like when the separate studies are read together?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
