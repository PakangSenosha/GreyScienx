research_definition:
  central_question: When does fertility support become cheaper than financing demographic decline?
  short_answer: 'In the average run, the median cost of one permanently additional birth ranges from about R720,000 for free childcare to R4.18 million for a parent tax exemption. The targeted family package costs about R780,000 per added birth and produces nearly 99,000 additional births per million prospective households. A cash top-up costs about R1.76 million per added birth and produces only about 12,000. Limitation: The largest payment is not the cheapest birth. A programme can pay households that would have had the child anyway, or it can only move the timing. The cost figures are medians from a stylised model, with wide 10th-to-90th percentile ranges in the manuscript.'
  abstract: When fertility support becomes cheaper than financing demographic decline.
  motivation: When fertility support becomes cheaper than financing demographic decline.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What is the fiscal comparison between supporting another child and financing an older population?
  - How does population decline change the public cost of low fertility?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
