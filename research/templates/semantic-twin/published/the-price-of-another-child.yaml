    text: In the average run, the median cost of one permanently additional birth ranges from about R720,000 for free childcare to R4.18 million for a parent tax exemption. The targeted family package costs about R780,000 per added birth and produces nearly 99,000 additional births per million prospective households. A cash top-up costs about R1.76 million per added birth and produces only about 12,000.
