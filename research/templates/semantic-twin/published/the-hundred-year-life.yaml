research_definition:
  central_question: How would education, work, housing, and family life be redesigned for lives of 100 to 120 years?
  short_answer: 'If a conventional life retires at 65 and the person lives to 120, retirement lasts 55 years and the modelled pension finances only 57 percent of the target income, even with uninterrupted employment. Limitation: South Africans do not currently live to 100 or 120 on average. The scenario explores extended healthy adulthood, not a forecast. If healthspan does not rise with lifespan, the financial results deteriorate and the care burden rises. A manual worker without stable work cannot simply be told to work to 85.'
  abstract: Education, work, housing and family life redesigned for 100–120 year lives.
  motivation: Education, work, housing and family life redesigned for 100–120 year lives.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What happens to housing when people live longer?
  - How do longer lives change work, education, and family timing?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
