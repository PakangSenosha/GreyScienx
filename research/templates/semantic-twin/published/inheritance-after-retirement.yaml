research_definition:
  central_question: What is the economic difference when inheritance arrives at 40, 55, 70, or 85?
  short_answer: 'If R1 million remains invested until age 100 at 4 percent above inflation, a living transfer at 35 becomes R12.80 million, an inheritance at 40 becomes R10.52 million, at 55 R5.84 million, at 70 R3.24 million, and at 85 R1.80 million, in constant 2026 rand. Limitation: These values exclude tax, fees, and consumption so that timing stays visible. The manuscript does not claim that 70 is today''s average age of inheritance in South Africa. If the heir spends the money, or if returns differ by owner, the age-100 values do not apply.'
  abstract: The economic value of inheritance arriving at 40, 55, 70 or 85.
  motivation: The economic value of inheritance arriving at 40, 55, 70 or 85.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does the age at which inheritance arrives change its economic value?
  - What happens to inheritance when retirement and longer lives move bequests later?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
