research_definition:
  central_question: Can automation, productivity, and immigration substitute for missing workers?
  short_answer: 'In the average case, a smaller resident workforce can still coincide with real GDP at an index of 151, because output per worker rises about 57 percent. The total workforce ends at 11.60 million after 75,000 young immigrants a year and 700,000 additional older workers. Limitation: This is a hypothetical scale, not a forecast of South Africa''s labour market. The 75,000-person inflow is below the roughly 90,000 a year that would hold contributor headcount at 12 million. Early immigrant cohorts also retire: 480,000 are retirees by 2076.'
  abstract: Automation, productivity and immigration as substitutes for missing workers.
  motivation: Automation, productivity and immigration as substitutes for missing workers.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What replaces workers when population decline leaves labour scarce?
  - How do automation and immigration compare as responses to a smaller workforce?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
