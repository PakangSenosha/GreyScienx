research_definition:
  central_question: How does South Africa's unequal property geography continue to compound into differences in wealth?
  short_answer: 'For matched descendants, the central scenario produces median marketable net worth after forty years of R3.67 million with a titled township home and R5.24 million with a middle-value suburban home. The difference is R1.57 million, in constant 2024 rand. Limitation: These are scenarios, not forecasts and not estimates for a racial group. The comparison shows that inherited property conditions can be large enough to matter. It does not show what share of the national wealth gap that mechanism causes.'
  abstract: How South Africa’s unequal property geography continues to compound into differences in wealth.
  motivation: How South Africa’s unequal property geography continues to compound into differences in wealth.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does inherited property geography relate to South Africa's racial wealth gap?
  - How do the type, location, and tenure of inherited property carry advantage across generations?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
