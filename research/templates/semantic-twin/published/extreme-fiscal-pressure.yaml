research_definition:
  central_question: How could emergency government measures introduced in 2050 alter the population system?
  short_answer: 'Every modelled path closes the first-year accounting gap of about R1.23 trillion. In the guardrailed case that ends in 2052, real output in 2080 is 1.2 percent below the no-shock path and the present value of lost output from 2050 to 2080 is R3.7 trillion. Limitation: This is a counterfactual model, not a forecast and not legal advice. Closing the accounting gap does not create the doctors, food, energy, tax capacity or pension wealth that the shock removes.'
  abstract: How emergency government measures introduced in 2050 could alter the population system.
  motivation: How emergency government measures introduced in 2050 could alter the population system.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What happens to the population system under extreme fiscal pressure?
  - How do emergency measures in a future decade feed back into work, retirement, and public finance?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
