research_definition:
  central_question: How can delaying rent and car ownership at the start of a career alter lifetime wealth?
  short_answer: 'In the central middle-salary Johannesburg scenario, living in the family home and delaying a car purchase for three years creates R602,000 more modelled net capital at age 25, and R3.32 million more modelled wealth at age 60, than moving out and financing a car immediately. The age-60 figure holds when the gap is preserved on the manuscript''s common post-25 path. Limitation: This is a modelled counterfactual for one representative worker, not a forecast and not a statement that every graduate can or should live at home. The age-60 level includes a common 10% retirement-saving path. The manuscript treats the gap between strategies as the robust quantity, and the level as a scale illustration.'
  abstract: How delaying rent and car ownership at the start of a career can alter lifetime wealth.
  motivation: How delaying rent and car ownership at the start of a career can alter lifetime wealth.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does living with parents during the first years of employment compare with paying rent for a separate household?
  - What is the lifetime wealth comparison between delaying car ownership and buying a car at first employment?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa, Johannesburg, Cape Town, Durban
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
