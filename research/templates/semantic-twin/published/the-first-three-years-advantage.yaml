limitations_and_risks:
  main_limitation: This is a modelled counterfactual for one representative worker, not a forecast and not a statement that every graduate can or should live at home. The age-60 level includes a common 10% retirement-saving path. The manuscript treats the gap between strategies as the robust quantity, and the level as a scale illustration.
  limitations:
  - This is a modelled counterfactual for one representative worker, not a forecast and not a statement that every graduate can or should live at home. The age-60 level includes a common 10% retirement-saving path. The manuscript treats the gap between strategies as the robust quantity, and the level as a scale illustration.
  - The two effects overlap slightly when they are combined, because interest on positive and negative balances differs. The split is a central-scenario comparison, not a rule for every city, salary, or commute.
  - The threshold is a diagnostic for this scenario. The manuscript does not present it as a fair-rent recommendation. A higher contribution can still be the right family choice while no longer raising the worker's private wealth.
  - The comparison is private money cost. It does not price safety, reliability, waiting, shift work, or access to a job. A 25% ride-hailing surge moves the modelled threshold to about 1,585 kilometres a month.
  data_gaps:
  - External microdata behind the manuscript are not republished in this form.
  model_risks:
  - A different assumption can move or reverse the scenario.
  implementation_risks:
  - The scenario is not an implementation plan.
  external_validity_limits:
  - The result is for the stated population, price basis and scenario.
  misuse_risks:
  - Do not present a modelled scenario as an observed outcome or forecast.
  - Do not report the catalogue description as a finding.
  falsification_conditions:
  - This is a modelled counterfactual for one representative worker, not a forecast and not a statement that every graduate can or should live at home. The age-60 level includes a common 10% retirement-saving path. The manuscript treats the gap between strategies as the robust quantity, and the level as a scale illustration.
  update_triggers:
  - Revise this form when the manuscript version changes.
