research_definition:
  central_question: What route runs from manganese extraction to higher-value battery production?
  short_answer: 'The manuscript''s first expansion is a qualified 30,000-tonne-a-year HPMSM platform linked to firm offtake, with partner-led cathode production and a later, conditional 4 to 6 GWh cell plant. Limitation: Cell and pack revenue is not created by manganese alone. Most of it pays for other materials, components, capital and distribution. The tower values must not be added together.'
  abstract: A route from mineral extraction to higher-value battery production.
  motivation: A route from mineral extraction to higher-value battery production.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How could a manganese industry move into battery manufacturing?
  - What industrial steps sit between mined manganese and batteries?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
