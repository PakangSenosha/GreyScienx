research_definition:
  central_question: What are the demographic and financial limits of retirement at 60?
  short_answer: 'In this funded-account model, a worker who starts at 25 on R30,000 a month, contributes 12 percent, and earns a 3 percent net real return exhausts a pension equal to 60 percent of final salary around age 70 if retirement begins at 60 and life lasts to 90. Limitation: This is one modelled path, not a forecast and not South Africa''s current retirement system. Amounts are constant 2026 rand before personal income tax. A value below zero is a funding shortfall, not literal bank debt. The manuscript also shows that a higher contribution, a higher return, or a later retirement age can support the same target.'
  abstract: The demographic and financial limits of retirement at 60.
  motivation: The demographic and financial limits of retirement at 60.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - Under what conditions does retirement at 60 remain financially viable?
  - How do ageing and lifetime finances constrain retirement at a fixed age?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
