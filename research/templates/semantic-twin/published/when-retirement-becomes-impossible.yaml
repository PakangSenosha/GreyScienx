limitations_and_risks:
  main_limitation: This is one modelled path, not a forecast and not South Africa's current retirement system. Amounts are constant 2026 rand before personal income tax. A value below zero is a funding shortfall, not literal bank debt. The manuscript also shows that a higher contribution, a higher return, or a later retirement age can support the same target.
  limitations:
  - This is one modelled path, not a forecast and not South Africa's current retirement system. Amounts are constant 2026 rand before personal income tax. A value below zero is a funding shortfall, not literal bank debt. The manuscript also shows that a higher contribution, a higher return, or a later retirement age can support the same target.
  - The replacement map holds salary growth at 1.5 percent real and indexes the pension to prices. A 60 percent target in the manuscript requires a much higher contribution, a higher return, or a later retirement age.
