research_definition:
  central_question: What are the macroeconomic consequences for South Africa of broad African income convergence?
  short_answer: 'If the rest of Africa grows at 4.2 percent and South Africa at 3.5 percent, the manuscript''s central scenario has South African GDP at about US$981 billion, real GDP per person up roughly 109 percent, and the continental GDP share down from 13.8 to 11.9 percent. Limitation: This is a conditional scenario, not a forecast that African convergence will happen. A falling rank is not a fall in South African income.'
  abstract: The macroeconomic consequences of broad African income convergence.
  motivation: The macroeconomic consequences of broad African income convergence.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - How does a richer African continent change the South African economy?
  - What happens to South African growth if African incomes converge upward?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
