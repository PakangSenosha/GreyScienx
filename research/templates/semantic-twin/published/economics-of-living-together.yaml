research_definition:
  central_question: How do early cohabitation, delayed cohabitation, and separate households compare in a Gauteng lifetime scenario?
  short_answer: 'For two Gauteng adults bringing home R30,000 and R20,000 a month, combining households at 25 rather than 35 leaves about R3.972 million more combined household wealth at 75 in the average scenario, in constant 2026 rand. The direct living-cost saving is about R1.059 million. The larger gap comes from investing that earlier saving and from avoiding expensive negative balances. Limitation: This is a modelled scenario, not a forecast, and it is household wealth rather than each person''s wealth. The manuscript keeps the relationship intact and invests the surplus. The advantage can disappear or reverse if the shared household costs almost as much as two homes, if the saving is consumed, or if separation costs exceed the accumulated benefit. Cohabitation here is a shared household, not a marriage result.'
  abstract: A Gauteng lifetime scenario comparing early cohabitation, delayed cohabitation and separate households.
  motivation: A Gauteng lifetime scenario comparing early cohabitation, delayed cohabitation and separate households.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What is the lifetime household comparison between living together and maintaining separate households?
  - How does the timing of cohabitation change the cost of living and saving?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa, Gauteng
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
