    heading_path:
    - Part I
    content_type: claim
    text: For two Gauteng adults bringing home R30,000 and R20,000 a month, combining households at 25 rather than 35 leaves about R3.972 million more combined household wealth at 75 in the average scenario, in constant 2026 rand. The direct living-cost saving is about R1.059 million. The larger gap comes from investing that earlier saving and from avoiding expensive negative balances.
