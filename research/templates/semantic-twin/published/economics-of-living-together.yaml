model:
  models:
  - id: M01
    canonical_id: GSX:HH-001:M01
    name: Lifetime household-timing model
    purpose: The model follows two household paths from age 25 to 75 in constant 2026 rand. They differ in when they combine households. After 35 their housing arrangement matches, so the remaining gap comes from returns on the earlier balance or from the cost of a negative balance. Best, average, and worst cases change growth, returns, shocks, children, and housing.
    model_class: scenario model
    statement: The model follows two household paths from age 25 to 75 in constant 2026 rand. They differ in when they combine households. After 35 their housing arrangement matches, so the remaining gap comes from returns on the earlier balance or from the cost of a negative balance. Best, average, and worst cases change growth, returns, shocks, children, and housing.
    inputs:
    - Two Gauteng earners
    - Ten-year difference in household timing
    - Average-case returns and costs
    - Surplus is invested
    - The relationship remains intact
    outputs:
    - R01
    - R02
    - R03
    time_step: stated in the manuscript prose
    implementation_file: research/source/expanded_lifetime_model.py
    version: '1.0'
