research_definition:
  central_question: What poverty, consumption, and social costs does the industrialisation counterfactual leave out when the grant is not paid?
  short_answer: 'Withholding the SRD envelope has a central explicit welfare cost of R426.9 billion in welfare-equivalent 2026 rand, about R1.68 of social cost for every R1 withheld. The scenario range is R237 billion to R743 billion. Limitation: This is not a Treasury invoice, a forecast or a confidence interval. Crime, unrest and household dissolution are left outside the priced total. The central case is an analytical benchmark.'
  abstract: The poverty, consumption and social cost omitted from the industrialisation counterfactual.
  motivation: The poverty, consumption and social cost omitted from the industrialisation counterfactual.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What is the welfare cost of withholding the SRD grant?
  - Which social costs sit outside a productive-capital account of the grant budget?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: the alternative use of the same resource or rule
  causal_scope: Treat the study as modelled exploratory research unless the manuscript explicitly establishes another evidentiary status.
