research_definition:
  central_question: How can platinum reserves connect to a hydrogen industrial base?
  short_answer: 'The manuscript''s industrial conclusion is a qualified PGM-component platform, with complete electrolysers and hydrogen exports only where customers, technology partners and low-cost electricity are already contracted. Limitation: Platinum ownership creates leverage, not automatic competitiveness. Most complete-system revenue pays for non-PGM components and services. The metal and system values are alternatives, not a sum.'
  abstract: A value-chain model connecting platinum reserves to a hydrogen industrial base.
  motivation: A value-chain model connecting platinum reserves to a hydrogen industrial base.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What value chain runs from platinum to a hydrogen economy?
  - How does hydrogen industrialisation use South Africa's platinum endowment?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
