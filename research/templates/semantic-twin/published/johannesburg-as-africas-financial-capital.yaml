research_definition:
  central_question: Under what conditions could Johannesburg finance a continent-scale economy?
  short_answer: 'In the central regional-hub scenario, an 8 percent capture share produces about US$90.4 billion of cumulative financial-services revenue and about US$71.2 billion of value retained in South Africa. Limitation: The captured flow is not South African GDP. The paths are constructed, not forecasts. Financial intermediation does not replace weak electricity, logistics, education or public institutions.'
  abstract: The conditions under which Johannesburg could finance a continent-scale economy.
  motivation: The conditions under which Johannesburg could finance a continent-scale economy.
  decision_relevance: The study is published so a reader can inspect the scenario, the assumption and the limitation together.
  main_output: A conditional modelled claim linked to its assumptions and results.
  bundled_questions: &id001
  - What would make Johannesburg Africa's financial capital?
  - How do continental growth and local institutions shape Johannesburg's financial role?
  related_questions: *id001
  exclusions:
  - The study does not convert a scenario into a forecast.
  unit_of_analysis: the scenario unit stated in the manuscript
  population_or_system: South Africa, Johannesburg
  comparator: the comparison case named in the central claim
  baseline: the baseline case named in the manuscript
  counterfactual: not_applicable
