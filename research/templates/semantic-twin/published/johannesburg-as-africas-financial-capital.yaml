  - id: M01
    canonical_id: GSX:AFR-002:M01
    name: Regional-hub financial-services model
    purpose: The model takes a constructed path for African gross capital formation, treats part of it as financeable, applies a Johannesburg capture share, and converts captured flow into fees and retained value.
    model_class: scale scenario
    statement: The model takes a constructed path for African gross capital formation, treats part of it as financeable, applies a Johannesburg capture share, and converts captured flow into fees and retained value.
    inputs:
    - gross capital formation
    - financeable share
    - capture share
    - fee rates
    outputs:
    - captured flow
    - revenue
    - retained value
    - jobs
    time_step: 2026-2050
    implementation_file: research/source/johannesburg-financial-capital/model.py
    version: '1.0'
  assumptions:
  - id: A01
    canonical_id: GSX:AFR-002:A01
    name: Central hub shares
    statement: Forty percent of gross capital formation is treated as institutionally or externally financeable. Johannesburg arranges, distributes, services or manages 8 percent of that pool.
